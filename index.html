<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Daily Planner AI</title>
    <style>
        :root {
            --bg-color: #f5f6fa;
            --card-bg: #ffffff;
            --text-main: #4a4a4a;
            --text-sub: #9b9b9b;
            --accent: #a8c0ff;
            --routine: #b5e2b9; /* 確定ルーティン：優しいグリーン */
            --cooking: #fbc531; /* 夕飯調理：温かみのあるイエロー */
            --task: #dcdde1;    /* 思いつきタスク：落ち着いたグレー */
            --calendar: #ff7675;/* カレンダー予定：柔らかなコーラルレッド */
            --border-color: #f1f2f6;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px 16px 160px 16px;
            max-width: 480px;
            margin: 0 auto;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 24px; font-weight: 600; margin: 0 0 6px 0; color: #6c5ce7; }
        .header p { font-size: 13px; color: var(--text-sub); margin: 0; }

        .ai-response-box {
            background: #f0edff;
            border: 1px solid #dcd6ff;
            border-radius: 18px;
            padding: 14px 16px;
            margin-bottom: 24px;
            font-size: 14px;
            line-height: 1.5;
            color: #574b90;
            position: relative;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.05);
        }
        .ai-response-box::before {
            content: '🤖 Gemini: ';
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
        }

        .timeline { position: relative; padding-left: 8px; }

        .timeline-item {
            position: relative; background: var(--card-bg); border-radius: 16px;
            padding: 14px 16px; margin-bottom: 14px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.02);
            border-left: 6px solid var(--accent);
            display: flex; align-items: center; justify-content: space-between;
        }

        .timeline-item.routine { border-left-color: var(--routine); }
        .timeline-item.cooking { border-left-color: var(--cooking); }
        .timeline-item.calendar { border-left-color: var(--calendar); }
        .timeline-item.task { border-left-color: var(--task); }

        .item-left { display: flex; align-items: center; gap: 12px; flex-grow: 1; }

        .time-input {
            font-size: 14px; font-weight: 700; color: #2f3640; border: none;
            background: #f1f2f6; padding: 4px 8px; border-radius: 8px; width: 60px; text-align: center;
        }

        .title-input { font-size: 15px; font-weight: 500; border: none; background: transparent; width: 100%; color: var(--text-main); padding: 4px; }
        .title-input:focus, .time-input:focus { background: #ffeaa7; outline: none; border-radius: 4px; }

        .item-right { display: flex; align-items: center; gap: 12px; }
        .delete-btn { background: none; border: none; color: #ff7675; font-size: 18px; cursor: pointer; padding: 4px; }

        .checkbox-container { position: relative; cursor: pointer; width: 22px; height: 22px; }
        .checkbox-container input { position: absolute; opacity: 0; }
        .checkmark { position: absolute; top: 0; left: 0; height: 22px; width: 22px; background-color: #f1f2f6; border: 2px solid #dcdde1; border-radius: 50%; transition: all 0.2s; }
        .checkbox-container input:checked ~ .checkmark { background-color: #6c5ce7; border-color: #6c5ce7; }
        .checkmark::after { content: ""; position: absolute; display: none; left: 7px; top: 3px; width: 5px; height: 9px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
        .checkbox-container input:checked ~ .checkmark::after { display: block; }

        .timeline-item.is-done { opacity: 0.4; }
        .timeline-item.is-done .title-input { text-decoration: line-through; }

        .chat-section {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--border-color); z-index: 1000;
        }

        .chat-wrapper {
            max-width: 440px; margin: 0 auto; display: flex; gap: 10px;
            background: #ffffff; padding: 6px 6px 6px 16px; border-radius: 28px;
            align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e8e8e8;
        }

        .chat-input { flex-grow: 1; border: none; background: transparent; font-size: 15px; outline: none; color: var(--text-main); }
        .send-btn { background: #6c5ce7; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3); }
        .send-btn svg { width: 18px; height: 18px; fill: white; }

        .status-indicator { text-align: center; font-size: 12px; color: #6c5ce7; font-weight: bold; margin-bottom: 12px; display: none; }
        
        .key-reset { font-size: 11px; color: var(--text-sub); background: none; border: none; text-decoration: underline; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <h1>Daily Planner AI ✨</h1>
    <p id="current-date">Loading...</p>
</div>

<div id="ai-response" class="ai-response-box">
    確定ルーティンをセットしました！今日のカレンダーの予定、思いつきの追加タスク、夕飯のメニューなどを教えてください。不要なルーティンがあれば「今日はお弁当なしで」のように言っていただければ除外します。
</div>

<div id="status" class="status-indicator">🎀 AIがスケジュールを調整中...</div>

<div id="timeline" class="timeline"></div>

<div style="text-align: center;">
    <button class="key-reset" onclick="resetApiKey()">APIキーを再設定する</button>
</div>

<div class="chat-section">
    <div class="chat-wrapper">
        <input type="text" id="chat-input" class="chat-input" placeholder="予定、思いつき、夕飯のメニューを入力...">
        <button class="send-btn" onclick="handleSend()">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>
</div>

<script>
    let API_KEY = localStorage.getItem('GEMINI_API_KEY');
    if (!API_KEY) {
        API_KEY = prompt("GeminiのAPIキーを入力してください。\n（キーはブラウザ内に安全に保存されます）");
        if (API_KEY) localStorage.setItem('GEMINI_API_KEY', API_KEY);
    }

    function resetApiKey() {
        localStorage.removeItem('GEMINI_API_KEY');
        location.reload();
    }

    // 🌞 毎日の確定ルーティン初期データ
    const baseRoutines = [
        { time: "07:00", title: "起床・お部屋リセット（カーテン開け/布団整え）", type: "routine", done: false },
        { time: "07:35", title: "お弁当作り 🍱（子供のお弁当準備）", type: "routine", done: false },
        { time: "08:00", title: "朝食＆ゆったり休憩 ☕️（【最重要】食後にサプリ！）", type: "routine", done: false },
        { time: "09:05", title: "朝の集中家事＆身支度（食器洗い/洗濯/掃除ロボ起動/洗面身支度）", type: "routine", done: false },
        { time: "12:00", title: "ランチ休憩 🥗（調理・食事・片付けをゆったり含む90分）", type: "routine", done: false },
        { time: "18:00", title: "夜の家事スタート（カーテン閉め/猫ちゃんご飯/お米研ぎ炊飯）", type: "routine", done: false },
        { time: "22:00", title: "入浴＆自由時間 🎧（お風呂/BTS動画/韓国語の勉強）", type: "routine", done: false },
        { time: "00:00", title: "就寝 🌙（夜更かし厳禁・絶対死守ライン）", type: "routine", done: false }
    ];

    let currentEvents = [...baseRoutines];

    function updateDateDisplay() {
        const d = new Date();
        document.getElementById('current-date').innerText = d.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    }

    function renderTimeline() {
        const container = document.getElementById('timeline');
        container.innerHTML = '';
        currentEvents.sort((a, b) => a.time.localeCompare(b.time));
        
        currentEvents.forEach((ev, idx) => {
            const item = document.createElement('div');
            item.className = `timeline-item ${ev.type} ${ev.done ? 'is-done' : ''}`;
            
            item.innerHTML = `
                <div class="item-left">
                    <input type="text" class="time-input" value="${ev.time}" onchange="updateTime(${idx}, this.value)">
                    <input type="text" class="title-input" value="${ev.title}" onchange="updateTitle(${idx}, this.value)">
                </div>
                <div class="item-right">
                    <button class="delete-btn" onclick="deleteItem(${idx})">🗑️</button>
                    <label class="checkbox-container">
                        <input type="checkbox" ${ev.done ? 'checked' : ''} onclick="toggleItem(${idx})">
                        <span class="checkmark"></span>
                    </label>
                </div>
            `;
            container.appendChild(item);
        });
    }

    function updateTime(idx, newTime) { currentEvents[idx].time = newTime; renderTimeline(); }
    function updateTitle(idx, newTitle) { currentEvents[idx].title = newTitle; }
    function deleteItem(idx) { currentEvents.splice(idx, 1); renderTimeline(); }
    function toggleItem(idx) { currentEvents[idx].done = !currentEvents[idx].done; renderTimeline(); }

    async function handleSend() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;
        if (!API_KEY) { alert("APIキーが設定されていません。"); return; }

        input.value = '';
        document.getElementById('status').style.display = 'block';

        const systemPrompt = `
        あなたはユーザーのスケジュールを一緒に育てる優秀なAIアシスタントです。
        ユーザーから新しい予定、思いつき、夕飯のメニューなどが届いたら、現在のタイムラインの状況を踏まえて、新しいスケジュールを提案してください。

        【現在のタイムラインデータ】: ${JSON.stringify(currentEvents)}
        ※初期状態で確定ルーティンが組み込まれています。ユーザーが「今日はお弁当なし」など不要な申告をした場合は、該当するルーティンデータをタイムラインから除外（削除）してください。

        【指示】:
        1. 夕飯のメニューが指定されたら、17:30〜18:10の間にそのメニューに最適な調理ステップ（例: 下ごしらえ、仕上げ加熱など）を2ステップ程度に分解し、"cooking"タイプとしてタイムラインに必ず組み込んでください。
        2. 出力は、ユーザーへの「おしゃべり（返答コメント）」と、更新後の「新しいタイムラインのJSONデータ」を両方含めるため、必ず以下の【出力形式】を厳守してください。

        【出力形式】:
        ココにユーザーへの親切で温かい返答コメント（調理のアドバイスやタスク配置の理由など）を書いてください。
        ===DATA===
        [
          {"time": "07:00", "title": "起床...", "type": "routine", "done": false},
          ...
        ]
        `;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: systemPrompt + "\n\nユーザーの入力: " + text }] }]
                })
            });

            const data = await response.json();
            const aiText = data.candidates[0].content.parts[0].text;
            
            const parts = aiText.split('===DATA===');
            if (parts.length === 2) {
                document.getElementById('ai-response').innerText = parts[0].trim();
                let jsonText = parts[1].replace(/```json|```/g, '').trim();
                currentEvents = JSON.parse(jsonText);
                renderTimeline();
            } else {
                document.getElementById('ai-response').innerText = "スケジュールをうまくパースできませんでした。もう一度試してみてください。";
            }

        } catch (error) {
            document.getElementById('ai-response').innerText = "エラーが発生しました。APIキーや通信状態を確認してください。";
            console.error(error);
        } finally {
            document.getElementById('status').style.display = 'none';
        }
    }

    updateDateDisplay();
    renderTimeline();
</script>
</body>
</html>
