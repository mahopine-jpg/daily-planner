<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Daily Planner AI</title>
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluent/180/000000/sparkling-particles.png">
    
    <!-- iPhoneタッチ操作用ドラッグライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

    <style>
        :root {
            --bg-color: #f5f4fa; /* 淡いラベンダーを基調とした背景 */
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --accent: #6c5ce7; /* 上品なラベンダーパープル */
            --routine: #b5e2b9;
            --cooking: #fbc531;
            --task: #dcdde1;
            --calendar: #ff7675;
            --border-color: #e8e7f5;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px 16px 160px 16px;
            max-width: 480px;
            margin: 0 auto;
        }

        body.dragging-active { overflow: hidden; position: fixed; width: 100%; }

        /* ✨ アプリ名と日付・曜日の大タイトルヘッダー */
        .app-header {
            text-align: center;
            margin-bottom: 24px;
            padding-top: env(safe-area-inset-top);
        }
        .app-header h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--accent);
            margin: 0 0 6px 0;
            letter-spacing: 0.5px;
        }
        .app-header .date-str {
            font-size: 15px;
            font-weight: 600;
            color: #8e8cb2;
            margin: 0;
        }

        /* 🐱 ネコ助風 AI返答ボックス */
        .ai-response-box {
            background: #f0edff; border: 1px solid #dcd6ff; border-radius: 20px;
            padding: 16px; margin-bottom: 24px; font-size: 14px; line-height: 1.6; color: #574b90;
            display: flex; gap: 12px; align-items: flex-start;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.04);
        }
        .ai-avatar {
            width: 42px; height: 42px; background: #ffffff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(108, 92, 231, 0.1);
        }
        .ai-content { flex-grow: 1; }
        .ai-name { font-weight: 700; font-size: 12px; color: #8e8cb2; margin-bottom: 2px; }

        .timeline { position: relative; }

        /* 📋 理想のデザインカード（横幅最大化、左チェック・右ハンドル） */
        .timeline-item {
            background: var(--card-bg); border-radius: 20px;
            padding: 16px 12px; margin-bottom: 14px;
            box-shadow: 0 6px 14px rgba(108,92,231,0.03);
            border: 1px solid var(--border-color);
            border-left: 6px solid var(--accent);
            display: flex; align-items: center; gap: 12px;
            touch-action: none;
        }

        .timeline-item.routine { border-left-color: var(--routine); }
        .timeline-item.cooking { border-left-color: var(--cooking); }
        .timeline-item.calendar { border-left-color: var(--calendar); }
        .timeline-item.task { border-left-color: var(--task); }

        /* 左側のチェックボックス */
        .checkbox-container { position: relative; cursor: pointer; width: 24px; height: 24px; flex-shrink: 0; }
        .checkbox-container input { position: absolute; opacity: 0; }
        .checkmark { position: absolute; top: 0; left: 0; height: 24px; width: 24px; background-color: #ffffff; border: 2px solid #cbd5e0; border-radius: 50%; transition: all 0.2s; }
        .checkbox-container input:checked ~ .checkmark { background-color: var(--accent); border-color: var(--accent); }
        .checkmark::after { content: ""; position: absolute; display: none; left: 8px; top: 4px; width: 5px; height: 9px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
        .checkbox-container input:checked ~ .checkmark::after { display: block; }

        /* 🗂️ 中央のテキストエリア（2段構造で横幅をフルに活かす） */
        .item-center { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
        
        /* 上部に逃がした時間表示 */
        .time-input {
            font-size: 13px; font-weight: 700; color: #a0aec0; border: none;
            background: transparent; width: 60px; padding: 0; outline: none;
        }

        /* 1段目：太字のタスク名 ＋ ミニ✕ボタン */
        .title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; }
        .title-input {
            font-size: 16px; font-weight: 700; border: none; background: transparent;
            width: 100%; color: #2d3748; outline: none;
            white-space: pre-wrap; word-break: break-all;
        }
        
        /* 2段目：詳細説明テキスト（自動折り返し） */
        .detail-input {
            font-size: 13px; font-weight: 400; border: none; background: transparent;
            width: 100%; color: #718096; outline: none; margin-top: 2px;
            white-space: pre-wrap; word-break: break-all;
        }
        
        .title-input:focus, .detail-input:focus { background: #fff9db; border-radius: 4px; }

        /* 最小限の「✕」削除ボタン */
        .delete-btn {
            background: none; border: none; color: #e53e3e; font-size: 14px;
            font-weight: bold; cursor: pointer; padding: 2px 6px; flex-shrink: 0; opacity: 0.3;
        }
        .delete-btn:hover { opacity: 0.8; }

        /* 右端：3本線ハンドル（右側にして親指で動かしやすく） */
        .item-right { display: flex; align-items: center; flex-shrink: 0; }
        .drag-handle { color: #cbd5e0; font-size: 20px; padding: 8px; cursor: grab; user-select: none; }

        .timeline-item.is-done { opacity: 0.4; }
        .timeline-item.is-done .title-input, .timeline-item.is-done .detail-input { text-decoration: line-through; }
        .sortable-ghost { opacity: 0.2; background: #6c5ce7 !important; }

        /* 下部固定のチャット欄 */
        .chat-section {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(245, 244, 250, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--border-color); z-index: 1000;
        }
        .chat-wrapper {
            max-width: 440px; margin: 0 auto; display: flex; gap: 10px;
            background: #ffffff; padding: 6px 6px 6px 16px; border-radius: 28px;
            align-items: center; box-shadow: 0 8px 20px rgba(108,92,231,0.06); border: 1px solid #e2e1f0;
        }
        .chat-input { flex-grow: 1; border: none; background: transparent; font-size: 15px; outline: none; color: var(--text-main); }
        .send-btn { background: #6c5ce7; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3); }
        .send-btn svg { width: 18px; height: 18px; fill: white; }
        .status-indicator { text-align: center; font-size: 12px; color: #6c5ce7; font-weight: bold; margin-bottom: 12px; display: none; }
        .key-reset { font-size: 11px; color: var(--text-sub); background: none; border: none; text-decoration: underline; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

<!-- 👑 新設：タイトル＆日付ヘッダーエリア -->
<div class="app-header">
    <h1>Daily Planner AI ✨</h1>
    <div id="current-date" class="date-str">Loading...</div>
</div>

<div class="ai-response-box">
    <div class="ai-avatar">🐱</div>
    <div class="ai-content">
        <div class="ai-name">ネコ助</div>
        <div id="ai-response">お待たせニャ！大好きな淡い紫のUIに直して、就寝時間も『23:50』の最後に移動させたニャ。タスク名と詳細説明がしっかり読めるように横幅をフルに広げたから、使い心地を試してほしいニャ〜🐾</div>
    </div>
</div>

<div id="status" class="status-indicator">🎀 AIがスケジュールを調整中...</div>

<div id="timeline" class="timeline"></div>

<div style="text-align: center;">
    <button class="key-reset" onclick="resetApiKey()">APIキーを再設定する</button>
</div>

<div class="chat-section">
    <div class="chat-wrapper">
        <input type="text" id="chat-input" class="chat-input" placeholder="予定、思いつき、夕飯のメニューを入力...">
        <button class="send-btn" onclick="handleSend()">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>
</div>

<script>
    let API_KEY = localStorage.getItem('GEMINI_API_KEY');
    if (!API_KEY) {
        API_KEY = prompt("GeminiのAPIキーを入力してください。");
        if (API_KEY) localStorage.setItem('GEMINI_API_KEY', API_KEY);
    }

    function resetApiKey() { localStorage.removeItem('GEMINI_API_KEY'); location.reload(); }

    // 🌞 毎日の確定ルーティンデータ（就寝時間を 23:50 に変更しました）
    const baseRoutines = [
        { time: "07:00", title: "起床・お部屋リセット", detail: "カーテン開け/布団整え/簡単な部屋の片付け（10分実働・残り20分バッファ）", type: "routine", done: false },
        { time: "07:35", title: "お弁当作り 🍱", detail: "子供のお弁当準備（20分）➔ 5分休憩", type: "routine", done: false },
        { time: "08:00", title: "朝食＆ゆったり休憩 ☕️", detail: "子供が出かけた後の朝ごはん。【最重要】食後にサプリを飲む。", type: "routine", done: false },
        { time: "09:05", title: "朝の集中家事＆身支度 🧹", detail: "食器洗い ➔ 洗濯機回す ➔ 掃除ロボ起動。その間に自身の洗面・身支度。", type: "routine", done: false },
        { time: "12:00", title: "ランチ休憩 🥗", detail: "調理・食事・片付けをゆったり含む（90分枠）", type: "routine", done: false },
        { time: "18:00", title: "夜の家事スタート 🐈", detail: "カーテン閉め/猫ちゃんにご飯をあげる/お米研ぎ炊飯開始。", type: "routine", done: false },
        { time: "22:00", title: "入浴＆自由時間 🎵", detail: "お風呂にゆっくり浸かり、BTSの動画を見たり韓国語の勉強をするリラックスタイム。", type: "routine", done: false },
        { time: "23:50", title: "就寝 🌙", detail: "夜更かし厳禁・健康のための絶対死守ライン！", type: "routine", done: false }
    ];

    let currentEvents = [...baseRoutines];

    // 日付を「曜日付き」で綺麗に表示する処理
    function updateDateDisplay() {
        const d = new Date();
        const weekDayStr = ["日", "月", "火", "水", "木", "金", "土"][d.getDay()];
        document.getElementById('current-date').innerText = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${weekDayStr}曜日）`;
    }

    function renderTimeline() {
        const container = document.getElementById('timeline');
        container.innerHTML = '';
        currentEvents.sort((a, b) => a.time.localeCompare(b.time));
        
        currentEvents.forEach((ev, idx) => {
            const item = document.createElement('div');
            item.className = `timeline-item ${ev.type} ${ev.done ? 'is-done' : ''}`;
            item.dataset.id = idx;
            
            // 決定レイアウト：左丸チェック ➔ フル幅（上時間・1段目太字タイトル＆✕・2段目詳細） ➔ 右ハンドル
            item.innerHTML = `
                <label class="checkbox-container">
                    <input type="checkbox" ${ev.done ? 'checked' : ''} onclick="toggleItem(${idx})">
                    <span class="checkmark"></span>
                </label>
                <div class="item-center">
                    <input type="text" class="time-input" value="${ev.time}" onchange="updateTime(${idx}, this.value)">
                    <div class="title-row">
                        <div contenteditable="true" class="title-input" onblur="updateTitle(${idx}, this.innerText)">${ev.title}</div>
                        <button class="delete-btn" onclick="deleteItem(${idx})">✕</button>
                    </div>
                    <div contenteditable="true" class="detail-input" onblur="updateDetail(${idx}, this.innerText)">${ev.detail || ''}</div>
                </div>
                <div class="item-right">
                    <div class="drag-handle">☰</div>
                </div>
            `;
            container.appendChild(item);
        });

        initSortable();
    }

    function updateTime(idx, newTime) { currentEvents[idx].time = newTime; renderTimeline(); }
    function updateTitle(idx, newTitle) { currentEvents[idx].title = newTitle; }
    function updateDetail(idx, newDetail) { currentEvents[idx].detail = newDetail; }
    function deleteItem(idx) { currentEvents.splice(idx, 1); renderTimeline(); }
    function toggleItem(idx) { currentEvents[idx].done = !currentEvents[idx].done; renderTimeline(); }

    function initSortable() {
        const container = document.getElementById('timeline');
        Sortable.create(container, {
            handle: '.drag-handle',
            animation: 180,
            delay: 30,
            delayOnTouchOnly: true,
            onStart: function() { document.body.classList.add('dragging-active'); },
            onEnd: function (evt) {
                document.body.classList.remove('dragging-active');
                let reordered = [];
                const items = container.querySelectorAll('.timeline-item');
                items.forEach(item => { reordered.push(currentEvents[item.dataset.id]); });

                let newIdx = evt.newIndex;
                let prevTime = newIdx > 0 ? reordered[newIdx - 1].time : "06:00";
                let nextTime = newIdx < reordered.length - 1 ? reordered[newIdx + 1].time : "23:59";
                
                reordered[newIdx].time = calculateMiddleTime(prevTime, nextTime);
                currentEvents = reordered;
                renderTimeline();
            }
        });
    }

    function calculateMiddleTime(t1, t2) {
        const toMins = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
        const toStr = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
        let m1 = toMins(t1); let m2 = toMins(t2);
        if (m1 >= m2) m2 += 15; 
        let middle = Math.floor((m1 + m2) / 2);
        return toStr(middle);
    }

    async function handleSend() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;
        if (!API_KEY) { alert("APIキーが設定されていません。"); return; }

        input.value = '';
        document.getElementById('status').style.display = 'block';

        const systemPrompt = `
        あなたはユーザーのスケジュールを一緒に育てる優秀なAIアシスタント「ネコ助」です。
        語尾には必ず「〜ニャ」「〜ニャ〜🐾」をつけて、親切で可愛らしく喋ってください。
        ユーザーから新しい予定、思いつき、夕飯のメニューなどが届いたら、現在のタイムラインの状況を踏まえて、新しいスケジュールを提案してください。

        【現在のタイムラインデータ】: ${JSON.stringify(currentEvents)}

        【指示】:
        1. 新しいタスクを追加する場合、太字になる"title"（10文字〜15文字程度の簡潔な名前）と、その詳細説明となる"detail"（具体的な手順や補足説明）の2つに必ず分解してデータを生成してください。
        2. 夕飯のメニューが指定されたら、17:30〜18:10の間にそのメニューに最適な調理ステップを2ステップ程度に分解し、"cooking"タイプとしてタイムラインに必ず組み込んでください。
        3. 出力は、ユーザーへの「おしゃべり（返答コメント）」と、更新後の「新しいタイムラインのJSONデータ」を両方含めるため、必ず以下の【出力形式】を厳守してください。

        【出力形式】:
        ココにネコ助としての可愛らしい返答コメントを書いてくださいニャ。
        ===DATA===
        [
          {"time": "07:00", "title": "起床・お部屋リセット", "detail": "カーテン開け/布団整え...", "type": "routine", "done": false},
          ...
        ]
        `;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: systemPrompt + "\n\nユーザーの入力: " + text }] }]
                })
            });

            const data = await response.json();
            const aiText = data.candidates[0].content.parts[0].text;
            
            const parts = aiText.split('===DATA===');
            if (parts.length === 2) {
                document.getElementById('ai-response').innerText = parts[0].trim();
                let jsonText = parts[1].replace(/```json|```/g, '').trim();
                currentEvents = JSON.parse(jsonText);
                renderTimeline();
            } else {
                document.getElementById('ai-response').innerText = "スケジュールをうまくパースできなかったニャ。もう一度試してほしいニャ。";
            }

        } catch (error) {
            document.getElementById('ai-response').innerText = "エラーが発生したニャ。キーや通信を確認してニャ。";
            console.error(error);
        } finally {
            document.getElementById('status').style.display = 'none';
        }
    }

    updateDateDisplay();
    renderTimeline();
</script>
</body>
</html>
